name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: discord
          POSTGRES_PASSWORD: discord_dev_pw
          POSTGRES_DB: discord_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discord -d discord_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://discord:discord_dev_pw@localhost:5432/discord_clone
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-jwt-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-at-least-32-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Grant CREATEDB for Prisma shadow database
        run: |
          PGPASSWORD=discord_dev_pw psql -h localhost -U discord -d discord_clone -c "ALTER USER discord CREATEDB;" || true

      - name: Prisma migrate deploy
        run: pnpm --filter @discord-clone/api exec prisma migrate deploy

      - name: Build API and Web
        run: |
          pnpm --filter @discord-clone/api build
          pnpm --filter @discord-clone/web build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
          NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:4000

      - name: Install Playwright browsers
        run: pnpm --filter @discord-clone/web exec playwright install chromium --with-deps

      - name: Run Playwright E2E
        run: pnpm test:e2e
